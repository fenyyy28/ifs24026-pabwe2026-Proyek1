# Blueprint deploy ke Render (satu layanan: API Express + tampilan Vue hasil build)
services:
  - type: web
    name: ifs24026-pabwe2026-proyek1
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
